name: Deploy image to Azure

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER || 'controlequipostest.azurecr.io' }}
  IMAGE_NAME: ${{ vars.ACR_IMAGE_NAME || 'controlequipos' }}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build and deploy production image
    needs: checks
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Sign in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Azure Automation restart runbook
        env:
          AZURE_AUTOMATION_WEBHOOK_URL: ${{ secrets.AZURE_AUTOMATION_WEBHOOK_URL }}
        if: success() && env.AZURE_AUTOMATION_WEBHOOK_URL != ''
        run: |
          curl --request POST \
            "$AZURE_AUTOMATION_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --fail-with-body \
            -d '{}'
