name: Build and push image to ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acr-main
  cancel-in-progress: true

env:
  ACR_NAME: controlequipostest
  ACR_LOGIN_SERVER: controlequipostest.azurecr.io
  IMAGE_NAME: controlequipos

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sign in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push latest image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Azure Automation restart runbook
        if: success()
        run: |
          curl --fail --show-error --silent --retry 3 --retry-delay 5 \
            --request POST \
            "${{ secrets.AZURE_AUTOMATION_WEBHOOK_URL }}"
